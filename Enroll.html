<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enrolment Admissions — LearnSpace Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-obsidian position-relative overflow-hidden py-5">
  <div class="light-beam beam-1"></div>
  <div class="light-beam beam-2"></div>
  <div class="perspective-grid-bg"></div>

  <div class="container position-relative z-2 max-w-500">
    <div class="css-modal-content border-gold-glow">
      <a href="index.html" class="css-modal-close">← Back to Hub</a>
      <div class="text-center mb-4">
        <span class="section-subtitle">COHORT ADMISSIONS</span>
        <h2 class="text-white font-serif h3">Secure Your Candidacy</h2>
        <p class="text-muted small">Submit your academic profile for syndicate review.</p>
      </div>
      <form onsubmit="event.preventDefault(); alert('Candidacy application submitted successfully!'); window.location.href='index.html';">
        <div class="mb-3">
          <label class="form-label text-muted x-small uppercase font-mono">Full Name</label>
          <input type="text" class="form-control bg-surface-dark border-gold-subtle text-white" placeholder="Evelyn Vance" required>
        </div>
        <div class="mb-3">
          <label class="form-label text-muted x-small uppercase font-mono">Email Address</label>
          <input type="email" class="form-control bg-surface-dark border-gold-subtle text-white" placeholder="evelyn@domain.com" required>
        </div>
        <div class="mb-4">
          <label class="form-label text-muted x-small uppercase font-mono">Target Discipline</label>
          <select class="form-select bg-surface-dark border-gold-subtle text-white">
            <option>Full Stack Web Development</option>
            <option>Artificial Intelligence & Neural Systems</option>
            <option>UI/UX Spatial Design</option>
          </select>
        </div>
        <button type="submit" class="btn btn-luxury-glow w-100 py-3 mb-3">Submit Application</button>
      </form>
    </div>
  </div>
</body>
</html>
